<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kardia Retrieval Playground</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f7f7fa;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 32px 28px 24px 28px;
        }
        h1 {
            text-align: center;
            color: #2d2d2d;
            margin-bottom: 8px;
        }
        .desc {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }
        label {
            font-weight: 500;
            color: #333;
            display: block;
            margin-bottom: 6px;
        }
        select, input[type="number"], input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }
        button {
            background: #4f8cff;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 10px 22px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
        .results {
            margin-top: 32px;
            background: #f3f6fa;
            border-radius: 8px;
            padding: 18px 16px;
            min-height: 60px;
        }
        .chunk {
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }
        .chunk:last-child {
            border-bottom: none;
        }
        .chunk-id {
            color: #888;
            font-size: 0.95em;
        }
        .error {
            color: #c00;
            margin-top: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Retrieval Playground</h1>
    <div class="desc">Experiment with different retrieval strategies and settings.</div>
    <form id="retrieval-form">
        <label for="strategy">Retrieval Strategy</label>
        <select id="strategy" name="strategy" required>
            <option value="">Loading...</option>
        </select>
        <label for="k">Top K Results</label>
        <input type="number" id="k" name="k" min="1" max="20" value="5" required>
        <label for="query">Query</label>
        <input type="text" id="query" name="query" placeholder="Enter your query..." required>
        <button type="submit">Retrieve</button>
    </form>
    <div class="results" id="results"></div>
    <div class="error" id="error"></div>
</div>
<script>
const strategySelect = document.getElementById('strategy');
const form = document.getElementById('retrieval-form');
const resultsDiv = document.getElementById('results');
const errorDiv = document.getElementById('error');

async function fetchStrategies() {
    try {
        const res = await fetch('/retrieval-strategies');
        if (!res.ok) throw new Error('Failed to fetch strategies');
        const data = await res.json();
        strategySelect.innerHTML = '';
        for (const s of data.strategies) {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s.charAt(0).toUpperCase() + s.slice(1);
            strategySelect.appendChild(opt);
        }
    } catch (e) {
        strategySelect.innerHTML = '<option value="">Error loading strategies</option>';
    }
}


form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorDiv.textContent = '';
    resultsDiv.innerHTML = 'Loading...';
    const strategy = strategySelect.value;
    const k = parseInt(document.getElementById('k').value, 10);
    const query = document.getElementById('query').value;
    const params = new URLSearchParams({
        query: query,
        strategy: strategy,
        top_k: k
    });
    try {
        const res = await fetch('/retrieve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, strategy, top_k: k })
        });
        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || 'Error retrieving results');
        }
        const data = await res.json();
        if (!data.results || !data.results.length) {
            resultsDiv.innerHTML = '<em>No results found.</em>';
            return;
        }
        resultsDiv.innerHTML = data.results.map(chunk => `
            <div class="chunk">
                <div class="chunk-id">Document ID: ${chunk.document_id}</div>
                <div class="chunk-id">Chunk ID: ${chunk.chunk_id || chunk.id}</div>
                <div><strong>Similarity:</strong> ${chunk.similarity !== undefined ? chunk.similarity.toFixed(3) : 'N/A'}</div>
                <div><strong>Content:</strong><br>${chunk.content ? chunk.content.replace(/\n/g, '<br>') : ''}</div>
            </div>
        `).join('');
    } catch (e) {
        resultsDiv.innerHTML = '';
        errorDiv.textContent = e.message;
    }
});

fetchStrategies();
</script>
</body>
</html>
