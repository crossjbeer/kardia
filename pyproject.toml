[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kardia"]

[project]
name = "kardia"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic",
    "pgvector",
    "uvicorn",
    "fastapi",
    "dotenv",
    "llama_index",
    "llama-index-embeddings-huggingface",
    "sentence-transformers",
    "psycopg2-binary",
    "langgraph",
    "llama-index-llms-anthropic"

]
